<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>地理総合 暗記ツール</title>
<style>
:root{
  --bg:#f3f5fc; --card:#ffffff; --text:#1b2033; --sub:#646d87; --line:#e2e6f1;
  --accent:#4f46e5; --accent-2:#7c3aed; --accent-bg:#eef0ff; --accent-ink:#3730a3;
  --ok:#059669; --ok-bg:#e6f8f0; --ng:#e11d48; --ng-bg:#ffeef1;
  --shadow:0 1px 2px rgba(30,40,90,.06),0 4px 14px rgba(30,40,90,.06);
  --shadow-lg:0 2px 4px rgba(30,40,90,.06),0 12px 32px rgba(30,40,90,.10);
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0e1120; --card:#171b2e; --text:#eceffa; --sub:#98a1ba; --line:#262c46;
    --accent:#8b93ff; --accent-2:#a78bfa; --accent-bg:#232949; --accent-ink:#c7ccff;
    --ok:#34d399; --ok-bg:#0f2f27; --ng:#fb7185; --ng-bg:#3a1822;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.28);
    --shadow-lg:0 2px 4px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;color:var(--text);
  background:radial-gradient(900px 380px at 100% -80px,color-mix(in srgb,var(--accent) 12%,transparent),transparent),var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  font-size:16px;line-height:1.7;letter-spacing:.01em}
button{font-family:inherit}

/* ---------- ヘッダー ---------- */
header{position:sticky;top:0;z-index:10;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);
  color:#fff;padding:env(safe-area-inset-top) 0 0;
  box-shadow:0 4px 18px rgba(79,70,229,.28)}
@media (prefers-color-scheme: dark){
  header{background:linear-gradient(135deg,#312e81 0%,#4c1d95 100%);box-shadow:0 4px 18px rgba(0,0,0,.45)}
}
h1{font-size:18px;font-weight:800;margin:0;padding:12px 16px 2px;letter-spacing:.02em}
.tabs{display:flex;gap:4px;margin:8px 12px 12px;padding:4px;border-radius:14px;background:rgba(255,255,255,.18)}
.tab{flex:1;padding:10px 6px;border:0;border-radius:11px;background:none;color:rgba(255,255,255,.88);
  font-size:15px;font-weight:700;cursor:pointer;transition:background .18s,color .18s,box-shadow .18s}
.tab.active{background:#fff;color:var(--accent);box-shadow:0 2px 8px rgba(20,20,60,.22)}
@media (prefers-color-scheme: dark){ .tab.active{background:#eceffa;color:#312e81} }

main{max-width:760px;margin:0 auto;padding:16px 14px calc(90px + env(safe-area-inset-bottom))}

/* ---------- ボタン ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
button.btn{padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--text);font-size:14px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);
  transition:transform .08s,box-shadow .15s,background .15s,border-color .15s}
button.btn:hover{border-color:var(--accent)}
button.btn:active{transform:scale(.97);box-shadow:none}
button.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
button.sm{padding:7px 12px;font-size:13px;border-radius:10px}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff;font-weight:700}
button.primary:hover{border-color:transparent;filter:brightness(1.07)}
button.big{padding:15px 18px;font-size:16px;border-radius:14px}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
button.ok:hover{border-color:var(--ok);filter:brightness(1.07)}
button.ghost{background:transparent;box-shadow:none;color:var(--sub)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}

/* ---------- チップ・範囲選択 ---------- */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--sub);font-size:13px;font-weight:600;cursor:pointer;user-select:none;
  transition:background .15s,color .15s,border-color .15s,transform .08s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-ink)}
.meta{color:var(--sub);font-size:13px;margin:2px 4px 12px}
details.scope{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px}
details.scope summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:13px 16px;font-weight:700;font-size:14.5px}
details.scope summary::-webkit-details-marker{display:none}
details.scope summary .lab{flex:1}
details.scope summary .cnt{color:var(--sub);font-size:12.5px;font-weight:600}
details.scope summary::after{content:"▾";color:var(--sub);transition:transform .2s}
details.scope[open] summary::after{transform:rotate(180deg)}
.scope-body{padding:2px 14px 6px}

/* ---------- 一問一答 ---------- */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:24px 4px 10px;padding-bottom:7px;
  border-bottom:2px solid var(--accent-bg);font-weight:800;font-size:15.5px;color:var(--accent-ink)}
.sec-head span{font-size:12px;font-weight:600;color:var(--sub);white-space:nowrap}
.sec-head:first-child{margin-top:6px}
.item{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px 14px 20px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow);overflow:hidden;
  transition:transform .08s,box-shadow .15s,border-color .15s}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line);transition:background .15s}
.item:active{transform:scale(.99)}
.item:has(.a:not(.hide))::before{background:linear-gradient(180deg,var(--accent),var(--accent-2))}
.item:has(.a:not(.hide)){border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.item .src{font-size:11.5px;color:var(--sub);margin-bottom:3px;font-weight:700}
.item .q{font-size:17px;font-weight:600;line-height:1.6}
.item .a{margin-top:10px;padding:11px 13px;border-radius:10px;font-weight:800;font-size:18px;line-height:1.55;
  background:var(--accent-bg);color:var(--accent-ink);animation:pop .18s ease-out}
.item .a.hide{background:transparent;color:var(--sub);font-weight:500;font-size:12.5px;
  border:1.5px dashed var(--line);text-align:center;animation:none;padding:8px}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:20;width:48px;height:48px;border-radius:50%;
  border:0;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:20px;font-weight:800;
  box-shadow:var(--shadow-lg);cursor:pointer}

/* ---------- 単語カード ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 18px;box-shadow:var(--shadow-lg)}
.panel h2{margin:0 0 12px;font-size:18px;font-weight:800}
.resume{border-radius:20px;padding:16px 18px;margin-bottom:14px;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:var(--shadow-lg)}
@media (prefers-color-scheme: dark){ .resume{background:linear-gradient(135deg,#3b3a9e,#5b2fa6)} }
.resume .rt{font-size:16px;font-weight:800}
.resume .rd{font-size:14px;margin:4px 0 10px;opacity:.95}
.resume .rbar{height:7px;border-radius:999px;background:rgba(255,255,255,.28);overflow:hidden;margin-bottom:12px}
.resume .rbar div{height:100%;background:#fff;border-radius:999px;width:0}
.resume .row{margin-top:0}
.resume button.btn{border-color:transparent}
.resume button.go{background:#fff;color:var(--accent);font-weight:800}
.resume button.del{background:rgba(255,255,255,.18);color:#fff;box-shadow:none}
.progress{height:9px;background:var(--accent-bg);border-radius:999px;overflow:hidden;margin:8px 0 12px}
.progress>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0;
  border-radius:999px;transition:width .25s ease}
.round{display:flex;justify-content:space-between;color:var(--sub);font-size:13.5px;font-weight:700}
.tally{display:flex;gap:8px;margin-bottom:14px;font-size:13px;font-weight:700}
.tally span{padding:4px 11px;border-radius:999px;background:var(--bg);color:var(--sub)}
.tally .t-ok{background:var(--ok-bg);color:var(--ok)}
.tally .t-ng{background:var(--ng-bg);color:var(--ng)}
.tally b{font-size:14.5px}
.qbox{margin:6px 0 16px;padding:18px 18px 18px 20px;border-radius:14px;background:var(--bg);
  border-left:5px solid var(--accent);font-size:20px;font-weight:700;line-height:1.6}
.qbox .src{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:4px}
input.ans{width:100%;padding:15px 16px;font-size:18px;border-radius:14px;border:2px solid var(--line);
  background:var(--card);color:var(--text);transition:border-color .15s,box-shadow .15s;font-family:inherit}
input.ans:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.row .btn{flex:1;min-width:120px}
#submit{flex:2}
#back{flex:0 0 auto;min-width:0;background:transparent;box-shadow:none;color:var(--sub);font-size:13px}
.result{border-radius:14px;padding:15px 16px;margin-top:14px;animation:pop .18s ease-out}
.result.good{background:var(--ok-bg);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.result.bad{background:var(--ng-bg);color:var(--ng);border:1px solid color-mix(in srgb,var(--ng) 35%,transparent);animation:shake .35s}
.result .big{font-size:21px;font-weight:800}
.result .correct{margin-top:6px;color:var(--text)}
.result .correct b{font-size:21px}
.wrongs{margin:12px 0 0;padding:0;list-style:none}
.wrongs li{padding:10px 2px;border-top:1px solid var(--line);font-size:14.5px}
.wrongs li b{color:var(--accent-ink)}
.score{font-size:36px;font-weight:800;margin:8px 0;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:var(--accent)}
.note{font-size:12.5px;color:var(--sub);margin-top:12px;line-height:1.75}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (min-width:600px){ h1{padding-left:24px} .tabs{margin-left:24px;margin-right:24px;max-width:420px} .qbox{font-size:22px} }
</style>
</head>
<body>
<header>
  <h1>🌏 地理総合 暗記ツール</h1>
  <div class="tabs">
    <button class="tab active" data-tab="t1">一問一答</button>
    <button class="tab" data-tab="t2">単語カード（入力）</button>
  </div>
</header>

<main>
  <!-- ========== タブ1: 一問一答 ========== -->
  <section id="t1">
    <details class="scope" id="scope1">
      <summary><span class="lab">📚 範囲を選ぶ</span><span class="cnt" id="cnt1"></span></summary>
      <div class="scope-body">
        <div class="chips" id="chips1"></div>
        <div class="toolbar">
          <button class="btn sm" id="sel1All">全選択</button>
          <button class="btn sm" id="sel1None">全解除</button>
        </div>
      </div>
    </details>
    <div class="toolbar">
      <button class="btn" id="showAll">すべて表示</button>
      <button class="btn" id="hideAll">すべて隠す</button>
      <button class="btn" id="shuffle1">シャッフル</button>
      <button class="btn" id="order1">順番に戻す</button>
    </div>
    <div class="meta" id="meta1"></div>
    <div id="list"></div>
  </section>

  <!-- ========== タブ2: 単語カード ========== -->
  <section id="t2" hidden>
    <div id="resumeBox" class="resume" hidden>
      <div class="rt">⏩ 前回の続きがあります</div>
      <div class="rd" id="resumeInfo"></div>
      <div class="rbar"><div id="resumeBar"></div></div>
      <div class="row">
        <button class="btn go big" id="resume">続きから再開</button>
        <button class="btn del" id="discard">破棄</button>
      </div>
    </div>

    <div id="setup" class="panel">
      <h2>範囲を選んで開始</h2>
      <div class="chips" id="chips2"></div>
      <div class="toolbar">
        <button class="btn sm" id="selAll">全選択</button>
        <button class="btn sm" id="selNone">全解除</button>
      </div>
      <div class="meta" id="meta2"></div>
      <div class="chips" id="orderOpt">
        <span class="chip on" data-v="shuffle">🔀 シャッフル</span>
        <span class="chip" data-v="order">📄 そのままの順番</span>
      </div>
      <button class="btn primary big" id="start" style="width:100%">スタート</button>
      <div class="note">全問を出題 → 間違えた問題だけで再挑戦、を全問正解するまで繰り返します（出題順は上の選択が毎周に適用されます）。<br>進み具合はこの端末のブラウザに自動で保存されます。閉じても、次に開いたときに「続きから再開」できます（ブラウザのデータを消したり、プライベートモードで開いたりすると保存されません）。</div>
    </div>

    <div id="quiz" class="panel" hidden>
      <div class="round"><span id="roundLabel"></span><span id="countLabel"></span></div>
      <div class="progress"><div id="bar"></div></div>
      <div class="tally"><span class="t-ok">○ <b id="tOk">0</b></span><span class="t-ng">× <b id="tNg">0</b></span><span>残り <b id="tLeft">0</b></span></div>
      <div class="qbox"><div class="src" id="qsrc"></div><div id="qtext"></div></div>
      <input id="input" class="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="答えを入力">
      <div class="row" id="rowAnswer">
        <button class="btn primary big" id="submit">答える</button>
        <button class="btn big" id="idk">わからない</button>
      </div>
      <div id="result" hidden></div>
      <div class="row" id="rowNext" hidden>
        <button class="btn ok big" id="selfOk" hidden>自分は分かってた（正解にする）</button>
        <button class="btn big" id="toBad" hidden>不正解に直す</button>
        <button class="btn big" id="redo">もう一度答える</button>
        <button class="btn primary big" id="next">次へ</button>
      </div>
      <div class="row"><button class="btn ghost" id="back">← ひとつ戻る</button></div>
    </div>

    <div id="end" class="panel" hidden>
      <div id="endTitle" class="round"></div>
      <div class="score" id="score"></div>
      <div id="endMsg"></div>
      <ul class="wrongs" id="wrongList"></ul>
      <div class="row">
        <button class="btn primary big" id="retry" hidden>間違えた問題だけで再挑戦</button>
        <button class="btn primary big" id="again" hidden>同じ範囲でもう一度（全問）</button>
        <button class="btn big" id="backEnd">← 最後の問題に戻る</button>
        <button class="btn big" id="toSetup">範囲を選び直す</button>
      </div>
    </div>
  </section>
</main>
<button class="fab" id="toTop" hidden aria-label="先頭へ戻る">↑</button>

<script>
/* ===================== データ ===================== */

/* ===================== 共通 ===================== */
function hashStr(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; } return (h>>>0).toString(36); }
const ALL = [];
SECTIONS.forEach(s=>{
  s.items.forEach(it=>{
    ALL.push({id:ALL.length, key:hashStr(s.id+'|'+it[0]), sec:s.id, secTitle:s.title, q:it[0], a:it[1], alts:it[2]||[]});
  });
});

const $ = s=>document.querySelector(s);
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function norm(s){
  s=String(s).normalize('NFKC').toLowerCase();
  s=s.replace(/[\s・･·,、，。.()（）「」\[\]【】:：>＞\-－−~～]/g,'');
  s=s.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));
  return s;
}
function isCorrect(input,item){
  const n=norm(input);
  if(!n) return false;
  return [item.a,...item.alts].some(x=>norm(x)===n);
}
function buildChips(container, selected, onChange){
  container.innerHTML='';
  SECTIONS.forEach(s=>{
    const c=document.createElement('span');
    c.className='chip'+(selected.has(s.id)?' on':'');
    c.textContent=s.title.replace(/^No\.(\d+)\s*/,'$1 ');
    c.title=s.title;
    c.onclick=()=>{
      if(selected.has(s.id)) selected.delete(s.id); else selected.add(s.id);
      c.classList.toggle('on');
      onChange();
    };
    container.appendChild(c);
  });
}

/* ===================== 自動保存（localStorage） ===================== */
const LS_KEY='chiri-memo-v2';
function loadSave(){
  try{ const o=JSON.parse(localStorage.getItem(LS_KEY)||'null'); if(o && o.v===2) return o; }catch(e){}
  return null;
}
const saved = loadSave();
let curTab='t1';

/* ===================== タブ切替 ===================== */
function setTab(t){
  curTab=t;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));
  $('#t1').hidden = t!=='t1';
  $('#t2').hidden = t!=='t2';
  $('#toTop').hidden = true;
  window.scrollTo(0,0);
}
document.querySelectorAll('.tab').forEach(b=>{ b.onclick=()=>{ setTab(b.dataset.tab); save(); }; });
window.addEventListener('scroll',()=>{ $('#toTop').hidden = !(curTab==='t1' && window.scrollY>700); },{passive:true});
$('#toTop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});

/* ===================== タブ1: 一問一答 ===================== */
const sel1 = new Set(SECTIONS.map(s=>s.id));
let order1 = ALL.map(x=>x.id);
let shuffled1 = false;
const shown = new Set();   // 答えを表示中のid

function render1(){
  const list=$('#list'); list.innerHTML='';
  const items=order1.map(i=>ALL[i]).filter(x=>sel1.has(x.sec));
  $('#meta1').textContent = items.length+' 問（タップで答えを表示／非表示）';
  $('#cnt1').textContent = sel1.size+' / '+SECTIONS.length+' 章';
  const frag=document.createDocumentFragment();
  let lastSec=null, secCount={};
  items.forEach(it=>{ secCount[it.sec]=(secCount[it.sec]||0)+1; });
  items.forEach((it,n)=>{
    if(!shuffled1 && it.sec!==lastSec){
      const h=document.createElement('div'); h.className='sec-head';
      h.append(it.secTitle);
      const c=document.createElement('span'); c.textContent=secCount[it.sec]+' 問'; h.appendChild(c);
      frag.appendChild(h); lastSec=it.sec;
    }
    const d=document.createElement('div'); d.className='item';
    const src=document.createElement('div'); src.className='src';
    src.textContent = shuffled1 ? ('#'+(n+1)+'　'+it.secTitle) : ('#'+(n+1));
    const q=document.createElement('div'); q.className='q'; q.textContent=it.q;
    const a=document.createElement('div');
    const upd=()=>{
      if(shown.has(it.id)){a.className='a'; a.textContent=it.a;}
      else{a.className='a hide'; a.textContent='タップして答えを見る';}
    };
    upd();
    d.onclick=()=>{ if(shown.has(it.id)) shown.delete(it.id); else shown.add(it.id); upd(); };
    d.append(src,q,a); frag.appendChild(d);
  });
  list.appendChild(frag);
}
function refreshChips1(){ buildChips($('#chips1'), sel1, render1); render1(); }
$('#sel1All').onclick=()=>{ SECTIONS.forEach(s=>sel1.add(s.id)); refreshChips1(); };
$('#sel1None').onclick=()=>{ sel1.clear(); refreshChips1(); };
$('#showAll').onclick=()=>{ ALL.forEach(x=>{ if(sel1.has(x.sec)) shown.add(x.id); }); render1(); };
$('#hideAll').onclick=()=>{ shown.clear(); render1(); };
$('#shuffle1').onclick=()=>{ order1=shuffle(ALL.map(x=>x.id)); shuffled1=true; render1(); };
$('#order1').onclick=()=>{ order1=ALL.map(x=>x.id); shuffled1=false; render1(); };
refreshChips1();

/* ===================== タブ2: 単語カード ===================== */
const sel2 = new Set(SECTIONS.map(s=>s.id));
let scope=[];      // 今回の出題範囲（全問）
let queue=[];      // 今の周の出題順
let idx=0;
let results=[];    // results[i] = {ok, skipped, typed, self, bad}
let round=1;
let phase='q';     // 'q' 回答前 / 'r' 結果表示中
let orderMode='shuffle';
let sessScreen='quiz';   // 保存用：最後にいた画面（quiz / end）
let sessionDone=false;   // 全問クリアしたら true（保存しない）

/* ---- 保存 ---- */
function buildSession(){
  if(!queue.length || sessionDone) return null;
  return { scope:scope.map(x=>x.key), queue:queue.map(x=>x.key),
           idx, results:queue.map((_,i)=>results[i]||null), round, phase, screen:sessScreen };
}
function save(){
  const o={ v:2, tab:curTab, sel2:[...sel2], orderMode, session:buildSession() };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(o)); }catch(e){}
}
function applySession(s){
  try{
    const byKey=new Map(ALL.map(x=>[x.key,x]));
    const q=[], r=[];
    s.queue.forEach((k,i)=>{ const it=byKey.get(k); if(it){ q.push(it); r.push(s.results[i]||undefined); } });
    if(!q.length) return;
    const sc=s.scope.map(k=>byKey.get(k)).filter(Boolean);
    queue=q; results=r; scope=sc.length?sc:q.slice(); round=s.round||1;
    idx=Math.min(Math.max(s.idx|0,0),q.length);
    phase = s.phase==='r' ? 'r' : 'q';
    sessScreen = (s.screen==='end' || idx>=q.length) ? 'end' : 'quiz';
    sessionDone=false;
  }catch(e){}
}

/* ---- 設定画面 ---- */
function updMeta2(){
  const n=ALL.filter(x=>sel2.has(x.sec)).length;
  $('#meta2').textContent='選択中：'+n+' 問';
  $('#start').disabled = n===0;
}
function onSel2(){ updMeta2(); save(); }
function refreshChips2(){ buildChips($('#chips2'), sel2, onSel2); updMeta2(); }
$('#selAll').onclick=()=>{ SECTIONS.forEach(s=>sel2.add(s.id)); refreshChips2(); save(); };
$('#selNone').onclick=()=>{ sel2.clear(); refreshChips2(); save(); };

function show(id){
  ['setup','quiz','end'].forEach(x=>$('#'+x).hidden = x!==id);
  if(id!=='setup') sessScreen=id;
  if(id==='setup') updResume();
  window.scrollTo(0,0);
}
function setOrderUI(){
  document.querySelectorAll('#orderOpt .chip').forEach(x=>x.classList.toggle('on',x.dataset.v===orderMode));
}
document.querySelectorAll('#orderOpt .chip').forEach(c=>{
  c.onclick=()=>{ orderMode=c.dataset.v; setOrderUI(); save(); };
});

/* ---- 再開ボックス ---- */
function countResults(){
  let ok=0, ng=0;
  queue.forEach((_,i)=>{ const r=results[i]; if(r){ if(r.ok) ok++; else ng++; } });
  return {ok, ng};
}
function updResume(){
  const box=$('#resumeBox');
  if(!buildSession()){ box.hidden=true; return; }
  const c=countResults(), n=queue.length;
  const where = sessScreen==='end' ? 'この周は最後まで解き終わっています' : (Math.min(idx+1,n))+' / '+n+' 問目';
  $('#resumeInfo').textContent='第'+round+'周'+(round>1?'（間違えた問題）':'')+'　'+where+'　○'+c.ok+'　×'+c.ng;
  $('#resumeBar').style.width=((c.ok+c.ng)/n*100)+'%';
  box.hidden=false;
}
function resumeSession(){
  if(!queue.length) return;
  if(sessScreen==='end'){ showEnd(); return; }
  show('quiz');
  if(phase==='r' && results[idx]) renderResult(); else showQuestion();
}
$('#resume').onclick=resumeSession;
$('#discard').onclick=()=>{
  if(!confirm('保存されている続きを破棄します。よろしいですか？')) return;
  queue=[]; results=[]; scope=[]; idx=0; round=1; sessionDone=false;
  save(); updResume();
};

/* ---- 出題 ---- */
function stats(){
  let c=0; const w=[];
  queue.forEach((it,i)=>{ const r=results[i]; if(r){ if(r.ok) c++; else w.push(it); } });
  return {c,w};
}
function startRound(items){
  queue = orderMode==='shuffle' ? shuffle(items) : items.slice().sort((a,b)=>a.id-b.id);
  idx=0; results=[]; sessionDone=false;
  show('quiz'); showQuestion();
}
$('#start').onclick=()=>{
  const items=ALL.filter(x=>sel2.has(x.sec));
  if(!items.length) return;
  if(buildSession() && !confirm('保存されている続きは消えます。新しく始めますか？')) return;
  scope=items; round=1; startRound(scope);
};

function updTally(){
  const c=countResults();
  $('#tOk').textContent=c.ok; $('#tNg').textContent=c.ng; $('#tLeft').textContent=queue.length-c.ok-c.ng;
}

function showQuestion(){
  phase='q';
  const it=queue[idx];
  $('#roundLabel').textContent='第'+round+'周'+(round>1?'（間違えた問題）':'');
  $('#countLabel').textContent=(idx+1)+' / '+queue.length;
  $('#bar').style.width=(idx/queue.length*100)+'%';
  $('#qsrc').textContent=it.secTitle;
  $('#qtext').textContent=it.q;
  const inp=$('#input'); inp.value=''; inp.disabled=false;
  $('#result').hidden=true; $('#rowNext').hidden=true; $('#rowAnswer').hidden=false;
  $('#back').disabled = idx===0;
  updTally(); save();
  setTimeout(()=>inp.focus(),30);
}

function renderResult(){
  phase='r';
  const it=queue[idx], r=results[idx];
  $('#roundLabel').textContent='第'+round+'周'+(round>1?'（間違えた問題）':'');
  $('#countLabel').textContent=(idx+1)+' / '+queue.length;
  $('#qsrc').textContent=it.secTitle;
  $('#qtext').textContent=it.q;
  const inp=$('#input'); inp.value=r.typed||''; inp.disabled=true;
  $('#rowAnswer').hidden=true;
  const box=$('#result'); box.hidden=false;
  box.className='result '+(r.ok?'good':'bad');
  box.innerHTML='';
  const t=document.createElement('div'); t.className='big';
  t.textContent = r.ok ? (r.self?'○ 正解にしました（分かってた）':'○ 正解！')
                       : (r.skipped?'答えを確認':(r.bad?'× 不正解に直しました':'× 不正解'));
  box.appendChild(t);
  if(!r.ok || r.self || norm(r.typed||'')!==norm(it.a)){
    const c=document.createElement('div'); c.className='correct';
    c.append('正解：'); const b=document.createElement('b'); b.textContent=it.a; c.appendChild(b);
    box.appendChild(c);
  }
  $('#selfOk').hidden = r.ok || r.skipped;
  $('#toBad').hidden = !r.ok;
  $('#rowNext').hidden=false;
  $('#back').disabled = false;
  $('#bar').style.width=((idx+1)/queue.length*100)+'%';
  updTally(); save();
  setTimeout(()=>$('#next').focus(),30);
}

function submit(){
  if(phase!=='q') return;
  const v=$('#input').value;
  if(!v.trim()) return;
  results[idx]={ok:isCorrect(v,queue[idx]), skipped:false, typed:v};
  renderResult();
}
$('#submit').onclick=submit;
$('#idk').onclick=()=>{ if(phase!=='q') return; results[idx]={ok:false, skipped:true, typed:''}; renderResult(); };

/* 「自分は分かってた」：不正解を正解扱いにする */
$('#selfOk').onclick=()=>{
  if(phase!=='r') return;
  const r=results[idx]; if(r.ok||r.skipped) return;
  r.ok=true; r.self=true; r.bad=false; renderResult();
};
/* 「不正解に直す」：押し間違いで正解にしたものを不正解に戻す */
$('#toBad').onclick=()=>{
  if(phase!=='r') return;
  const r=results[idx]; if(!r.ok) return;
  r.ok=false; r.self=false; r.bad=true; renderResult();
};
/* 「もう一度答える」：この問題の結果を消して答え直す */
$('#redo').onclick=()=>{
  if(phase!=='r') return;
  results[idx]=undefined; showQuestion();
};

function next(){
  if(phase!=='r') return;
  idx++;
  if(idx>=queue.length) showEnd(); else showQuestion();
}
$('#next').onclick=next;

/* 「ひとつ戻る」 */
$('#back').onclick=()=>{
  if(phase==='r'){ results[idx]=undefined; showQuestion(); }       // 結果表示中 → 同じ問題を答え直す
  else if(idx>0){ idx--; renderResult(); }                          // 回答前 → 一つ前の問題の結果（修正可）
};
$('#backEnd').onclick=()=>{ sessionDone=false; idx=queue.length-1; show('quiz'); renderResult(); };

$('#input').addEventListener('keydown',e=>{
  if(e.key==='Enter' && !e.isComposing && e.keyCode!==229){ e.preventDefault(); submit(); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && phase==='r' && !$('#quiz').hidden && document.activeElement){
    if(document.activeElement.tagName==='BUTTON') return; // ボタン自身のクリックに任せる
    e.preventDefault(); next();
  }
});

function showEnd(){
  show('end');
  const total=queue.length, st=stats(), wrong=st.w;
  $('#endTitle').textContent='第'+round+'周 終了';
  $('#score').textContent=st.c+' / '+total+' 正解';
  const wl=$('#wrongList'); wl.innerHTML='';
  if(wrong.length){
    $('#endMsg').textContent='間違えた問題 '+wrong.length+' 問：';
    wrong.forEach(it=>{
      const li=document.createElement('li');
      const q=document.createElement('div'); q.textContent=it.q;
      const a=document.createElement('div'); a.append('→ '); const b=document.createElement('b'); b.textContent=it.a; a.appendChild(b);
      li.append(q,a); wl.appendChild(li);
    });
    $('#retry').hidden=false; $('#again').hidden=true;
    sessionDone=false;
  }else{
    $('#endMsg').textContent=(round>1?'間違えた問題をすべてクリアしました！🎉':'全問正解！🎉');
    $('#retry').hidden=true; $('#again').hidden=false;
    sessionDone=true;    // 全部クリア → 続きは保存しない
  }
  save();
}
$('#retry').onclick=()=>{ const w=stats().w; round++; startRound(w); };
$('#again').onclick=()=>{ round=1; startRound(scope); };
$('#toSetup').onclick=()=>{ show('setup'); };

/* ===================== 起動時：前回の状態を復元 ===================== */
if(saved){
  if(Array.isArray(saved.sel2)){
    const valid=new Set(SECTIONS.map(s=>s.id));
    sel2.clear(); saved.sel2.forEach(id=>{ if(valid.has(id)) sel2.add(id); });
  }
  if(saved.orderMode==='order' || saved.orderMode==='shuffle') orderMode=saved.orderMode;
  if(saved.session) applySession(saved.session);
}
setOrderUI();
refreshChips2();
updResume();
if(saved && (saved.tab==='t1' || saved.tab==='t2')) setTab(saved.tab);
</script>
</body>
</html>
